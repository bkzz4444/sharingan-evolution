<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sharingan Evolution</title>
  <style>
    :root {
      --bg: #000000;
      --accent: #ef4444;
      --text-muted: rgba(255, 255, 255, 0.36);
      --bar-idle: rgba(255, 255, 255, 0.14);
    }

    body[data-stage="6"] {
      --accent: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      width: 100%;
      padding: 2rem;
    }

    /* Eyes container */
    .eyes-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(2.4rem, 7.5vw, 5.8rem);
      cursor: pointer;
      transition: filter 0.38s ease, transform 0.28s ease;
      will-change: filter, transform;
    }

    body[data-stage="1"] .eyes-wrapper {
      filter: drop-shadow(0 0 6px rgba(220, 38, 38, 0.22));
    }
    body[data-stage="2"] .eyes-wrapper {
      filter: drop-shadow(0 0 9px rgba(220, 38, 38, 0.34));
    }
    body[data-stage="3"] .eyes-wrapper {
      filter: drop-shadow(0 0 13px rgba(239, 38, 38, 0.46));
    }
    body[data-stage="4"] .eyes-wrapper {
      filter:
        drop-shadow(0 0 14px rgba(239, 35, 35, 0.65))
        drop-shadow(0 0 34px rgba(185, 28, 28, 0.36));
    }
    body[data-stage="5"] .eyes-wrapper {
      animation: emsGlow 2.6s ease-in-out infinite;
    }
    body[data-stage="6"] .eyes-wrapper {
      animation: rinneganGlow 2.8s ease-in-out infinite;
    }

    body.is-charging .eyes-wrapper {
      transform: scale(1.03);
    }

    body.is-blinking .eyes-wrapper {
      animation: none !important;
      filter: drop-shadow(0 0 0 rgba(0, 0, 0, 0)) !important;
    }

    .eye-svg {
      width: clamp(150px, 33vw, 250px);
      height: auto;
      overflow: visible;
    }

    .eye-svg.right {
      transform: scaleX(-1);
    }

    /* Stage visibility */
    .eye-stage {
      opacity: 0;
    }

    body[data-stage="1"] .eye-stage[data-s="1"],
    body[data-stage="2"] .eye-stage[data-s="2"],
    body[data-stage="3"] .eye-stage[data-s="3"],
    body[data-stage="4"] .eye-stage[data-s="4"],
    body[data-stage="5"] .eye-stage[data-s="5"],
    body[data-stage="6"] .eye-stage[data-s="6"] {
      opacity: 1;
    }

    /* Smooth spins */
    .spin-slow { transform-origin: 120px 51px; animation: spinCW 5.6s linear infinite; }
    .spin-med  { transform-origin: 120px 51px; animation: spinCW 3.8s linear infinite; }
    .spin-fast { transform-origin: 120px 51px; animation: spinCW 2.5s linear infinite; }
    .spin-ms   { transform-origin: 120px 51px; animation: spinCW 2.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .spin-ems  { transform-origin: 120px 51px; animation: spinCCW 2.9s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .rinnegan-rings { transform-origin: 120px 51px; animation: pulseRings 2.8s ease-in-out infinite; }

    /* Eyelid blink */
    .eyelid-top {
      transform-origin: 120px 0px;
      transform: scaleY(0);
    }
    .eyelid-bottom {
      transform-origin: 120px 110px;
      transform: scaleY(0);
    }
    body.blink-run .eyelid-top {
      animation: blinkTop 0.4s cubic-bezier(0.45, 0, 0.55, 1) forwards;
    }
    body.blink-run .eyelid-bottom {
      animation: blinkBottom 0.4s cubic-bezier(0.45, 0, 0.55, 1) forwards;
    }

    /* Ultra-clean minimalist indicator */
    .minimal-hud {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
    }

    .stage-name {
      font-size: 0.72rem;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 500;
      transition: color 0.35s ease;
    }

    body[data-stage="6"] .stage-name {
      color: rgba(216, 180, 254, 0.65);
    }

    .progress-bars {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .bar-btn {
      width: 24px;
      height: 16px;
      display: flex;
      align-items: center;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .bar-line {
      width: 100%;
      height: 2px;
      border-radius: 2px;
      background: var(--bar-idle);
      transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.25s ease;
    }

    .bar-btn:hover .bar-line {
      background: rgba(255, 255, 255, 0.42);
    }

    .bar-btn.active .bar-line {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      transform: scaleY(1.4);
    }

    /* Keyframes */
    @keyframes spinCW  { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinCCW { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

    @keyframes blinkTop {
      0%   { transform: scaleY(0); }
      44%  { transform: scaleY(1); }
      56%  { transform: scaleY(1); }
      100% { transform: scaleY(0); }
    }
    @keyframes blinkBottom {
      0%   { transform: scaleY(0); }
      44%  { transform: scaleY(0.86); }
      56%  { transform: scaleY(0.86); }
      100% { transform: scaleY(0); }
    }

    @keyframes emsGlow {
      0%, 100% {
        filter:
          drop-shadow(0 0 14px rgba(248, 40, 40, 0.72))
          drop-shadow(0 0 34px rgba(185, 28, 28, 0.45));
      }
      50% {
        filter:
          drop-shadow(0 0 22px rgba(255, 65, 65, 0.92))
          drop-shadow(0 0 48px rgba(220, 38, 38, 0.65));
      }
    }

    @keyframes rinneganGlow {
      0%, 100% {
        filter:
          drop-shadow(0 0 15px rgba(192, 132, 252, 0.84))
          drop-shadow(0 0 36px rgba(139, 92, 246, 0.55));
      }
      50% {
        filter:
          drop-shadow(0 0 24px rgba(216, 180, 254, 0.96))
          drop-shadow(0 0 54px rgba(147, 51, 234, 0.74));
      }
    }

    @keyframes pulseRings {
      0%, 100% { transform: scale(0.985); }
      50%      { transform: scale(1.028); }
    }

    @media (prefers-reduced-motion: reduce) {
      .spin-slow, .spin-med, .spin-fast, .spin-ms, .spin-ems, .rinnegan-rings {
        animation: none !important;
      }
    }
  </style>
</head>
<body data-stage="1">
  <main class="stage" role="status" aria-label="Sharingan Evolution">
    <!-- Shared SVG Definitions -->
    <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
      <defs>
        <radialGradient id="sclera-grad" cx="50%" cy="58%" r="68%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="75%" stop-color="#ececf1" />
          <stop offset="100%" stop-color="#d2d2dc" />
        </radialGradient>

        <radialGradient id="sharingan-grad" cx="50%" cy="48%" r="52%">
          <stop offset="0%" stop-color="#ff3636" />
          <stop offset="56%" stop-color="#dc1919" />
          <stop offset="90%" stop-color="#990d0d" />
          <stop offset="100%" stop-color="#470404" />
        </radialGradient>

        <radialGradient id="ms-grad" cx="50%" cy="50%" r="52%">
          <stop offset="0%" stop-color="#ff3b3b" />
          <stop offset="62%" stop-color="#d41414" />
          <stop offset="94%" stop-color="#850a0a" />
          <stop offset="100%" stop-color="#3d0303" />
        </radialGradient>

        <radialGradient id="rinnegan-grad" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#f5ebff" />
          <stop offset="32%" stop-color="#d8b4fe" />
          <stop offset="70%" stop-color="#b48cf2" />
          <stop offset="100%" stop-color="#7c5bc4" />
        </radialGradient>

        <g id="tomoe-shape">
          <circle cx="0" cy="0" r="4.6" fill="#08080a" />
          <path d="M -3.4,-3.1 C -5.8,-6.8 -2.1,-11.4 2.9,-11.6 C -0.2,-9.5 -0.6,-6.6 1.7,-3.9 Z" fill="#08080a" />
        </g>

        <!-- Itachi Mangekyō Sweeping Blade -->
        <path id="itachi-blade" d="M -5,-10 C 6,-33 24,-29 30,-15.5 C 20,-17.5 13.5,-10.5 9.5,-3 L 0,0 Z" fill="#08080a" />

        <!-- Sasuke Eternal Mangekyō Crimson Petal -->
        <path id="ems-petal" d="M 0,-33.5 Q 15,0 0,33.5 Q -15,0 0,-33.5 Z" fill="url(#ms-grad)" stroke="#08080a" stroke-width="2.1" />
      </defs>
    </svg>

    <div class="eyes-wrapper" id="eyesTrigger" title="Click to evolve">
      <!-- LEFT EYE (Fierce, angular Uchiha anime contour) -->
      <svg class="eye-svg left" viewBox="0 0 240 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <!-- Sharp, narrow, fierce Uchiha eye opening -->
          <clipPath id="eye-clip-left">
            <path d="M 10,20 L 72,18 C 134,18 188,36 226,76 L 214,82 C 166,84 102,80 56,68 C 30,60 16,42 10,20 Z" />
          </clipPath>
        </defs>

        <!-- Subtle upper eyelid fold (anime depth) -->
        <path d="M 38,11 C 102,8 164,19 208,46"
              fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.6" stroke-linecap="round" />

        <g id="left-eye-interior" clip-path="url(#eye-clip-left)">
          <!-- STAGE 1: 1-TOMOE -->
          <g class="eye-stage" data-s="1">
            <rect x="0" y="0" width="240" height="110" fill="url(#sclera-grad)" />
            <circle cx="120" cy="51" r="34.5" fill="url(#sharingan-grad)" stroke="#08080a" stroke-width="3" />
            <g class="spin-slow">
              <circle cx="120" cy="51" r="20" fill="none" stroke="#08080a" stroke-width="1.7" opacity="0.82" />
              <use href="#tomoe-shape" transform="translate(120, 31) rotate(35)" />
            </g>
            <circle cx="120" cy="51" r="7.2" fill="#08080a" />
            <ellipse cx="105" cy="39" rx="3.8" ry="2.1" transform="rotate(-22 105 39)" fill="rgba(255,255,255,0.4)" />
            <path d="M 4,14 L 74,12 C 138,12 194,32 234,74 L 234,84 C 194,44 138,26 74,26 L 4,28 Z" fill="rgba(8, 8, 12, 0.24)" />
          </g>

          <!-- STAGE 2: 2-TOMOE -->
          <g class="eye-stage" data-s="2">
            <rect x="0" y="0" width="240" height="110" fill="url(#sclera-grad)" />
            <circle cx="120" cy="51" r="34.5" fill="url(#sharingan-grad)" stroke="#08080a" stroke-width="3" />
            <g class="spin-med">
              <circle cx="120" cy="51" r="20" fill="none" stroke="#08080a" stroke-width="1.8" />
              <use href="#tomoe-shape" transform="translate(120, 31) rotate(35)" />
              <use href="#tomoe-shape" transform="translate(120, 71) rotate(215)" />
            </g>
            <circle cx="120" cy="51" r="7.5" fill="#08080a" />
            <ellipse cx="105" cy="39" rx="3.8" ry="2.1" transform="rotate(-22 105 39)" fill="rgba(255,255,255,0.4)" />
            <path d="M 4,14 L 74,12 C 138,12 194,32 234,74 L 234,84 C 194,44 138,26 74,26 L 4,28 Z" fill="rgba(8, 8, 12, 0.24)" />
          </g>

          <!-- STAGE 3: 3-TOMOE -->
          <g class="eye-stage" data-s="3">
            <rect x="0" y="0" width="240" height="110" fill="url(#sclera-grad)" />
            <circle cx="120" cy="51" r="34.5" fill="url(#sharingan-grad)" stroke="#08080a" stroke-width="3" />
            <g class="spin-fast">
              <circle cx="120" cy="51" r="20" fill="none" stroke="#08080a" stroke-width="1.9" />
              <use href="#tomoe-shape" transform="translate(120, 31) rotate(35)" />
              <use href="#tomoe-shape" transform="translate(137.3, 61) rotate(155)" />
              <use href="#tomoe-shape" transform="translate(102.7, 61) rotate(275)" />
            </g>
            <circle cx="120" cy="51" r="7.8" fill="#08080a" />
            <ellipse cx="105" cy="39" rx="3.8" ry="2.1" transform="rotate(-22 105 39)" fill="rgba(255,255,255,0.4)" />
            <path d="M 4,14 L 74,12 C 138,12 194,32 234,74 L 234,84 C 194,44 138,26 74,26 L 4,28 Z" fill="rgba(8, 8, 12, 0.24)" />
          </g>

          <!-- STAGE 4: MANGEKYŌ SHARINGAN (Itachi) -->
          <g class="eye-stage" data-s="4">
            <rect x="0" y="0" width="240" height="110" fill="url(#sclera-grad)" />
            <circle cx="120" cy="51" r="34.5" fill="url(#ms-grad)" stroke="#08080a" stroke-width="3.2" />
            <g class="spin-ms">
              <g transform="translate(120, 51)">
                <use href="#itachi-blade" transform="rotate(0)" />
                <use href="#itachi-blade" transform="rotate(120)" />
                <use href="#itachi-blade" transform="rotate(240)" />
                <circle cx="0" cy="0" r="11" fill="#08080a" />
                <circle cx="0" cy="0" r="4.4" fill="#ef2323" />
              </g>
            </g>
            <ellipse cx="105" cy="39" rx="3.5" ry="1.9" transform="rotate(-22 105 39)" fill="rgba(255,255,255,0.32)" />
            <path d="M 4,14 L 74,12 C 138,12 194,32 234,74 L 234,84 C 194,44 138,26 74,26 L 4,28 Z" fill="rgba(8, 8, 12, 0.26)" />
          </g>

          <!-- STAGE 5: ETERNAL MANGEKYŌ SHARINGAN (Sasuke EMS) -->
          <g class="eye-stage" data-s="5">
            <rect x="0" y="0" width="240" height="110" fill="url(#sclera-grad)" />
            <circle cx="120" cy="51" r="34.5" fill="#08080a" stroke="#08080a" stroke-width="3.2" />
            <g class="spin-ems">
              <g transform="translate(120, 51)">
                <use href="#ems-petal" transform="rotate(0)" />
                <use href="#ems-petal" transform="rotate(60)" />
                <use href="#ems-petal" transform="rotate(120)" />
                <path d="M 0,-23 Q 5,-2.8 19.9,11.5 Q 0,5.8 -19.9,11.5 Q -5,-2.8 0,-23 Z" fill="#08080a" />
                <circle cx="0" cy="0" r="3.6" fill="#ff2e2e" />
              </g>
            </g>
            <ellipse cx="105" cy="39" rx="3.4" ry="1.8" transform="rotate(-22 105 39)" fill="rgba(255,255,255,0.3)" />
            <path d="M 4,14 L 74,12 C 138,12 194,32 234,74 L 234,84 C 194,44 138,26 74,26 L 4,28 Z" fill="rgba(8, 8, 12, 0.28)" />
          </g>

          <!-- STAGE 6: RINNEGAN -->
          <g class="eye-stage" data-s="6">
            <rect x="0" y="0" width="240" height="110" fill="url(#rinnegan-grad)" />
            <g class="rinnegan-rings" fill="none" stroke="#160f24" stroke-width="2" opacity="0.92">
              <circle cx="120" cy="51" r="13.5" />
              <circle cx="120" cy="51" r="25" />
              <circle cx="120" cy="51" r="37" />
              <circle cx="120" cy="51" r="50" />
              <circle cx="120" cy="51" r="64" />
              <circle cx="120" cy="51" r="79" />
              <circle cx="120" cy="51" r="95" />
              <circle cx="120" cy="51" r="112" />
            </g>
            <circle cx="120" cy="51" r="4.4" fill="#100a1a" />
            <path d="M 4,14 L 74,12 C 138,12 194,32 234,74 L 234,84 C 194,44 138,26 74,26 L 4,28 Z" fill="rgba(28, 10, 52, 0.28)" />
          </g>

          <!-- Eyelid shutters -->
          <rect class="eyelid-top" x="0" y="0" width="240" height="62" fill="#000000" />
          <rect class="eyelid-bottom" x="0" y="48" width="240" height="62" fill="#000000" />
        </g>

        <!-- Razor-sharp tapered anime upper eyelash (filled brushstroke) -->
        <path d="M 3,17 L 74,13 C 140,13 196,34 230,77 L 224,78 C 188,39 135,22 72,22 L 12,23 Z" fill="#0a0a0d" />
        <!-- Crisp delicate lower eyelid line -->
        <path d="M 226,76 L 214,82 C 166,84 102,80 56,68 C 30,60 16,42 10,20"
              fill="none" stroke="#0d0d12" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />
      </svg>

      <!-- RIGHT EYE -->
      <svg class="eye-svg right" viewBox="0 0 240 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <clipPath id="eye-clip-right">
            <path d="M 10,20 L 72,18 C 134,18 188,36 226,76 L 214,82 C 166,84 102,80 56,68 C 30,60 16,42 10,20 Z" />
          </clipPath>
        </defs>

        <path d="M 38,11 C 102,8 164,19 208,46"
              fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.6" stroke-linecap="round" />

        <g id="right-eye-interior" clip-path="url(#eye-clip-right)"></g>

        <path d="M 3,17 L 74,13 C 140,13 196,34 230,77 L 224,78 C 188,39 135,22 72,22 L 12,23 Z" fill="#0a0a0d" />
        <path d="M 226,76 L 214,82 C 166,84 102,80 56,68 C 30,60 16,42 10,20"
              fill="none" stroke="#0d0d12" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />
      </svg>
    </div>

    <!-- Ultra-clean stage indicator -->
    <div class="minimal-hud">
      <p class="stage-name" id="stageName">1-Tomoe Sharingan</p>
      <div class="progress-bars" role="tablist" aria-label="Evolution Stages">
        <button class="bar-btn active" data-goto="1" title="1-Tomoe Sharingan"><span class="bar-line"></span></button>
        <button class="bar-btn" data-goto="2" title="2-Tomoe Sharingan"><span class="bar-line"></span></button>
        <button class="bar-btn" data-goto="3" title="3-Tomoe Sharingan"><span class="bar-line"></span></button>
        <button class="bar-btn" data-goto="4" title="Mangekyō Sharingan"><span class="bar-line"></span></button>
        <button class="bar-btn" data-goto="5" title="Eternal Mangekyō"><span class="bar-line"></span></button>
        <button class="bar-btn" data-goto="6" title="Rinnegan"><span class="bar-line"></span></button>
      </div>
    </div>
  </main>

  <script>
    const leftInterior = document.getElementById('left-eye-interior');
    const rightInterior = document.getElementById('right-eye-interior');
    Array.from(leftInterior.children).forEach((child) => {
      rightInterior.appendChild(child.cloneNode(true));
    });

    const NAMES = [
      '1-Tomoe Sharingan',
      '2-Tomoe Sharingan',
      '3-Tomoe Sharingan',
      'Mangekyō Sharingan',
      'Eternal Mangekyō',
      'Rinnegan'
    ];

    const STAGE_HOLD_MS = 2800;
    const CHARGE_MS = 260;
    const BLINK_HALF_MS = 185;
    const BLINK_TOTAL_MS = 410;

    let currentStage = 1;
    let isTransitioning = false;
    let timerId = null;

    const stageNameEl = document.getElementById('stageName');
    const bars = document.querySelectorAll('.bar-btn');
    const eyesTrigger = document.getElementById('eyesTrigger');

    function updateHUD(stageId) {
      stageNameEl.textContent = NAMES[stageId - 1];
      bars.forEach((b) => b.classList.toggle('active', Number(b.dataset.goto) === stageId));
    }

    function transitionTo(targetStage) {
      if (isTransitioning || targetStage === currentStage) return;
      isTransitioning = true;

      document.body.classList.add('is-charging');

      setTimeout(() => {
        document.body.classList.remove('is-charging');
        document.body.classList.add('blink-run', 'is-blinking');

        setTimeout(() => {
          currentStage = targetStage;
          document.body.setAttribute('data-stage', String(currentStage));
          updateHUD(currentStage);
        }, BLINK_HALF_MS);

        setTimeout(() => {
          document.body.classList.remove('is-blinking');
        }, BLINK_HALF_MS + 55);

        setTimeout(() => {
          document.body.classList.remove('blink-run');
          isTransitioning = false;
          scheduleNext();
        }, BLINK_TOTAL_MS);
      }, CHARGE_MS);
    }

    function scheduleNext() {
      clearTimeout(timerId);
      timerId = setTimeout(() => {
        const next = currentStage >= NAMES.length ? 1 : currentStage + 1;
        transitionTo(next);
      }, STAGE_HOLD_MS);
    }

    bars.forEach((btn) => {
      btn.addEventListener('click', () => {
        clearTimeout(timerId);
        transitionTo(Number(btn.dataset.goto));
      });
    });

    eyesTrigger.addEventListener('click', () => {
      clearTimeout(timerId);
      const next = currentStage >= NAMES.length ? 1 : currentStage + 1;
      transitionTo(next);
    });

    updateHUD(1);
    scheduleNext();
  </script>
</body>
</html>
